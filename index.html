<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Jurnal Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  /* Layout: satu kolom lebar. Ringkasan angka di atas, kurva ekuitas dan rincian strategi di tengah, log trade di bawah. */
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #F6F7FB;
  --ink: #131A2B;
  --muted: #586278;
  --line: #DCE1EA;
  --accent: #2B47D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8ECFD;
  --gain: #0B7F5B;
  --gain-soft: #E1F3EA;
  --loss: #BF3029;
  --loss-soft: #FBE8E5;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #151C2E; --surface-2: #1B2338; --ink: #E8ECF6; --muted: #98A3BA;
    --line: #28324B; --accent: #8EA2FF; --accent-ink: #0D1220; --accent-soft: #232E5C;
    --gain: #3FD3A0; --gain-soft: #123A30; --loss: #FF8077; --loss-soft: #43201F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #151C2E; --surface-2: #1B2338; --ink: #E8ECF6; --muted: #98A3BA;
  --line: #28324B; --accent: #8EA2FF; --accent-ink: #0D1220; --accent-soft: #232E5C;
  --gain: #3FD3A0; --gain-soft: #123A30; --loss: #FF8077; --loss-soft: #43201F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1120px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 56px; display: flex; flex-direction: column; gap: 16px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top h1 { margin: 0; font: 600 34px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.top .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-weight: 500; }

.banner { border: 1px solid var(--line); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.banner b { font-weight: 700; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 16px 0; }
.panel-head h2 { margin: 0; font: 600 18px/1.2 var(--display); }
.panel-body { padding: 12px 16px 16px; min-width: 0; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { margin-top: 4px; font: 600 clamp(17px, 1.7vw, 21px)/1.25 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi.lead .v { font-size: clamp(21px, 2.2vw, 26px); }
.kpi .s { margin-top: 2px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 920px) { .kpis { grid-template-columns: 1.5fr repeat(5, 1fr); } }

/* Middle grid */
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 920px) { .grid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
.settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.settings input, .settings select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
.settings input { width: 130px; font-family: var(--mono); }
.readout { min-height: 20px; margin: 6px 0 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.readout b { color: var(--ink); }
#chart { width: 100%; height: 240px; }
#chart svg { display: block; touch-action: pan-y; }
.grid-l { stroke: var(--line); stroke-width: 1; }
.base-l { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; }
.tk { fill: var(--muted); font: 11px var(--mono); }
.eq-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.eq-area { fill: var(--accent); fill-opacity: .1; }
.eq-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.hv-l { stroke: var(--muted); stroke-width: 1; }
.empty { margin: 0; padding: 40px 8px; text-align: center; color: var(--muted); }

/* Breakdown */
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.cap { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); }
.brk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.brk .r1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.brk .nm { font-weight: 600; overflow-wrap: anywhere; }
.brk .mt { font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--gain); }
.bar i.neg { background: var(--loss); }

/* Log */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
.filters input[type="search"] { flex: 1 1 180px; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.tablewrap { overflow-x: auto; margin-top: 12px; border-top: 1px solid var(--line); }
table { width: 100%; min-width: 880px; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
th.r, td.r { text-align: right; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
tr.detail td { background: var(--surface-2); }
.detail-grid { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 12.5px; color: var(--muted); }
.detail-grid b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.detail-note { margin: 8px 0 0; max-width: 70ch; white-space: pre-wrap; }
.rowtoggle { border: 0; background: none; padding: 0; font-family: var(--mono); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; text-align: left; }
.rowtoggle::before { content: '▸'; font-size: 10px; color: var(--muted); transition: transform .12s; }
.rowtoggle[aria-expanded="true"]::before { transform: rotate(90deg); }
.pill { display: inline-block; font: 600 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; }
.pill.long { background: var(--accent-soft); color: var(--accent); }
.pill.short { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pill.open { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--muted); }
.act { white-space: nowrap; text-align: right; }
.act button { border: 0; background: none; padding: 2px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.act button:hover { color: var(--ink); text-decoration: underline; }
.act .del { color: var(--loss); }
.foot { color: var(--muted); font-size: 12px; }

/* Drawer */
.drawer { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: rgba(8, 12, 24, .5); }
.sheet { position: relative; width: min(480px, 100%); height: 100%; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding-inline: 16px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font: 600 22px/1.2 var(--display); }
.icon { border: 0; background: none; font-size: 24px; line-height: 1; color: var(--muted); padding: 4px 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input:not([type="radio"]), .field select, .field textarea { width: 100%; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.field textarea { min-height: 84px; resize: vertical; }
.hint { font-size: 11.5px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 8px 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
.preview { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--surface-2); font: 500 13px var(--mono); }
.err { margin: 0; color: var(--loss); font-size: 13px; font-weight: 600; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; max-width: calc(100% - 32px); }
.toast.bad { background: var(--loss); color: #fff; }
@media (prefers-reduced-motion: reduce) { .rowtoggle::before { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Jurnal Trading</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="actions">
      <select class="sel" id="period" aria-label="Periode">
        <option value="all">Semua waktu</option>
        <option value="month">Bulan ini</option>
        <option value="30">30 hari terakhir</option>
        <option value="90">90 hari terakhir</option>
      </select>
      <button class="btn" id="btn-export" type="button">Ekspor CSV</button>
      <button class="btn primary" id="btn-add" type="button">+ Tambah trade</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="kpis" id="kpis" aria-label="Ringkasan performa"></section>

  <div class="grid">
    <section class="panel" aria-labelledby="h-eq">
      <div class="panel-head">
        <h2 id="h-eq">Kurva ekuitas</h2>
        <div class="settings">
          <label for="set-start">Modal awal</label>
          <input id="set-start" type="number" min="0" step="any" inputmode="decimal">
          <select id="set-cur" aria-label="Mata uang">
            <option value="IDR">IDR</option>
            <option value="USD">USD</option>
            <option value="USDT">USDT</option>
          </select>
        </div>
      </div>
      <div class="panel-body">
        <div class="readout" id="readout"></div>
        <div id="chart"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-brk">
      <div class="panel-head">
        <h2 id="h-brk">Rincian</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-setup" data-tab="setup" aria-selected="true">Strategi</button>
          <button type="button" role="tab" id="tab-tag" data-tab="tag" aria-selected="false">Psikologi</button>
        </div>
      </div>
      <div class="panel-body" id="brk"></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="h-log">
    <div class="panel-head">
      <h2 id="h-log">Log trade</h2>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="Cari instrumen atau strategi" aria-label="Cari trade">
      <select class="sel" id="result" aria-label="Filter hasil">
        <option value="all">Semua hasil</option>
        <option value="win">Menang</option>
        <option value="loss">Kalah</option>
        <option value="open">Terbuka</option>
      </select>
    </div>
    <div class="tablewrap" id="log"></div>
  </section>

  <p class="foot" id="storage"></p>
</div>

<aside class="drawer" id="drawer" hidden>
  <div class="scrim" data-action="close"></div>
  <form class="sheet" id="trade-form" role="dialog" aria-modal="true" aria-labelledby="d-title" novalidate>
    <div class="sheet-head">
      <h2 id="d-title">Tambah trade</h2>
      <button type="button" class="icon" data-action="close" aria-label="Tutup">×</button>
    </div>
    <div class="fields">
      <div class="field"><label for="f-date">Tanggal</label><input id="f-date" type="date"></div>
      <div class="field"><label for="f-symbol">Instrumen</label><input id="f-symbol" type="text" maxlength="24" autocomplete="off" placeholder="BBCA, XAUUSD, BTC/USDT"></div>
      <div class="field"><label for="f-asset">Jenis aset</label>
        <select id="f-asset">
          <option value="saham">Saham (IDX)</option>
          <option value="kripto">Kripto</option>
          <option value="forex">Forex</option>
          <option value="emas">Emas (XAU)</option>
          <option value="perak">Perak (XAG)</option>
          <option value="kontrak">Futures / CFD</option>
        </select>
      </div>
      <div class="field"><span class="lbl">Posisi</span>
        <div class="seg">
          <input type="radio" name="side" id="side-long" value="long" checked><label for="side-long">Long</label>
          <input type="radio" name="side" id="side-short" value="short"><label for="side-short">Short</label>
        </div>
      </div>
      <div class="field"><label for="f-entry">Harga masuk</label><input id="f-entry" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label for="f-exit">Harga keluar</label><input id="f-exit" type="number" min="0" step="any" inputmode="decimal"><span class="hint">Kosongkan jika posisi masih terbuka.</span></div>
      <div class="field"><label for="f-qty" id="lbl-qty">Jumlah (lot)</label><input id="f-qty" type="number" min="0" step="any" inputmode="decimal"><span class="hint" id="hint-qty"></span></div>
      <div class="field"><label for="f-fee">Biaya (komisi + pajak)</label><input id="f-fee" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>
      <div class="field"><label for="f-mult">Ukuran kontrak</label><input id="f-mult" type="number" min="0" step="any" inputmode="decimal"><span class="hint">Kosongkan untuk memakai bawaan jenis aset.</span></div>
      <div class="field"><label for="f-sl">Stop loss</label><input id="f-sl" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label for="f-tp">Target</label><input id="f-tp" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="field"><label for="f-setup">Strategi</label><input id="f-setup" type="text" list="setups" maxlength="40" autocomplete="off" placeholder="Breakout, Pullback MA20"><datalist id="setups"></datalist></div>
      <div class="field"><label for="f-tag">Psikologi</label>
        <select id="f-tag">
          <option value="">Tidak dicatat</option>
          <option>Sesuai rencana</option>
          <option>FOMO</option>
          <option>Revenge trade</option>
          <option>Geser stop loss</option>
          <option>Keluar terlalu cepat</option>
          <option>Overtrade</option>
          <option>Tanpa setup</option>
        </select>
      </div>
      <div class="field full"><label for="f-notes">Catatan</label><textarea id="f-notes" placeholder="Alasan masuk, kondisi pasar, yang dipelajari"></textarea></div>
    </div>
    <p class="preview" id="f-preview"></p>
    <p class="err" id="f-error" role="alert" hidden></p>
    <div class="sheet-foot">
      <button type="button" class="btn" data-action="close">Batal</button>
      <button type="submit" class="btn primary">Simpan</button>
    </div>
  </form>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };

  var ASSETS = {
    saham: { label: 'Saham', unit: 'Lot', mult: 100, hint: '1 lot = 100 lembar' },
    kripto: { label: 'Kripto', unit: 'Unit', mult: 1, hint: 'Jumlah koin' },
    forex: { label: 'Forex', unit: 'Lot', mult: 100000, hint: '1 lot standar = 100.000 unit. P/L dalam mata uang kuotasi (USD untuk EURUSD).' },
    emas: { label: 'Emas (XAU)', unit: 'Lot', mult: 100, hint: '1 lot = 100 oz, jadi 0,01 lot = 1 oz. P/L dalam USD.' },
    perak: { label: 'Perak (XAG)', unit: 'Lot', mult: 5000, hint: '1 lot = 5.000 oz. P/L dalam USD.' },
    kontrak: { label: 'Futures / CFD', unit: 'Kontrak', mult: 1, hint: 'P/L = selisih harga × jumlah' }
  };
  var DEFAULT_SETTINGS = { start: 50000000, currency: 'IDR' };
  var LS_KEY = 'jurnal-trading-v1';

  var state = {
    trades: [], settings: Object.assign({}, DEFAULT_SETTINGS),
    mode: 'pending', ready: false, col: null, dl: null,
    period: 'all', q: '', result: 'all', tab: 'setup',
    expanded: {}, confirmDel: null, editingId: null, editingCreated: null,
    derived: null
  };

  /* ---------- format ---------- */
  var nf0 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
  var nf1 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var nfPx = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 6 });
  var nfCompact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
  var MINUS = '−';

  function money(n, o) {
    var c = state.settings.currency, a = Math.abs(n), body;
    if (c === 'IDR') body = 'Rp ' + nf0.format(a);
    else if (c === 'USD') body = '$' + nf2.format(a);
    else body = nf2.format(a) + ' USDT';
    var sign = n < 0 && Math.round(a * 100) > 0 ? MINUS : (o && o.sign && n > 0 ? '+' : '');
    return sign + body;
  }
  function compact(n) {
    var a = Math.abs(n);
    if (state.settings.currency !== 'IDR') return nfCompact.format(n);
    var s;
    if (a >= 1e9) s = nf1.format(a / 1e9).replace(',0', '') + ' M';
    else if (a >= 1e6) s = nf1.format(a / 1e6).replace(',0', '') + ' jt';
    else if (a >= 1e3) s = nf0.format(a / 1e3) + ' rb';
    else s = nf0.format(a);
    return (n < 0 ? MINUS : '') + s;
  }
  function pct(x, d) { return new Intl.NumberFormat('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }).format(x * 100) + '%'; }
  function fmtR(r) { return r == null ? '—' : (r > 0 ? '+' : r < 0 ? MINUS : '') + nf1.format(Math.abs(r)) + 'R'; }
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function addDays(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
  function fmtDate(s, y) {
    var d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString('id-ID', y ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
  }
  function num(v) { if (v === '' || v == null) return null; var n = Number(v); return isFinite(n) ? n : null; }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function sum(a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); }

  /* ---------- perhitungan ---------- */
  function calc(t) {
    var a = ASSETS[t.asset] || ASSETS.saham;
    var dir = t.side === 'short' ? -1 : 1;
    var qty = +t.qty || 0;
    var mult = t.mult > 0 ? +t.mult : a.mult;
    var hasExit = t.exit != null && t.exit !== '' && isFinite(+t.exit);
    var out = { open: !hasExit, pnl: null, r: null, risk: 0, mult: mult };
    if (hasExit) out.pnl = (t.exit - t.entry) * dir * qty * mult - (+t.fee || 0);
    if (t.sl != null && t.sl !== '' && isFinite(+t.sl)) out.risk = Math.abs(t.entry - t.sl) * qty * mult;
    if (hasExit && out.risk > 0) out.r = out.pnl / out.risk;
    return out;
  }

  /* ---------- data contoh (hanya di memori) ---------- */
  function sampleTrades() {

    var rows = [
      [38, 'BBCA', 'long', 9200, 9450, 20, 9050, 'Breakout', 'Sesuai rencana', 'Tembus resisten 9.200 dengan volume 1,8x rata-rata.'],

      [28, 'BMRI', 'long', 5050, 5275, 30, 4950, 'Pullback MA20', 'Sesuai rencana', ''],
      [26, 'ADRO', 'short', 2540, 2480, 40, 2590, 'Reversal', 'Sesuai rencana', ''],
      [23, 'BBRI', 'long', 4150, 4040, 60, 4080, 'Breakout', 'Geser stop loss', 'Stop loss digeser dua kali, keluar lebih dalam dari rencana.'],

      [15, 'TLKM', 'long', 3210, 3170, 50, 3150, 'Pullback MA20', 'Revenge trade', 'Masuk lagi sehari setelah loss, belum ada sinyal baru.'],
      [12, 'BBCA', 'long', 9350, 9600, 20, 9200, 'Breakout', 'Sesuai rencana', ''],

      [3, 'BMRI', 'long', 5300, 5340, 30, 5230, 'Pullback MA20', 'Keluar terlalu cepat', 'Target 5.450, tapi keluar di 5.340 karena cemas.'],
      [1, 'ADRO', 'long', 2610, null, 40, 2560, 'Breakout', 'Sesuai rencana', '']
    ];
    return rows.map(function (r, i) {
      var ex = r[4] == null ? r[3] : r[4];
      return {
        id: 's' + i, sample: true, createdAt: i, date: addDays(t0, -r[0]), symbol: r[1], asset: 'saham', side: r[2],
        entry: r[3], exit: r[4], qty: r[5], sl: r[6], tp: null,
        fee: r[4] == null ? 0 : Math.round((r[3] + ex) * r[5] * 100 * 0.002),
        setup: r[7], tag: r[8], notes: r[9]
      };
    });
  }

  /* ---------- turunan data ---------- */
  function periodCutoff() {
    var t = todayStr();
    if (state.period === 'month') return t.slice(0, 8) + '01';
    if (state.period === '30') return addDays(t, -30);
    if (state.period === '90') return addDays(t, -90);
    return '';
  }
  function cmpAsc(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0); }

  function derive() {
    var isSample = state.trades.length === 0;
    var all = (isSample ? sampleTrades() : state.trades).map(function (t) { return Object.assign({}, t, calc(t)); });
    var cutoff = periodCutoff();
    var closedAll = all.filter(function (t) { return !t.open; }).sort(cmpAsc);
    var base = +state.settings.start || 0, closed = [];
    closedAll.forEach(function (t) { if (t.date < cutoff) base += t.pnl; else closed.push(t); });
    var pts = [{ eq: base, label: 'Awal' }], eq = base;
    closed.forEach(function (t) { eq += t.pnl; pts.push({ eq: eq, t: t }); });

    var wins = closed.filter(function (t) { return t.pnl > 0; });
    var losses = closed.filter(function (t) { return t.pnl < 0; });
    var gw = sum(wins, function (t) { return t.pnl; });
    var gl = -sum(losses, function (t) { return t.pnl; });
    var peak = base, mdd = 0, mddPct = 0;
    pts.forEach(function (p) {
      if (p.eq > peak) peak = p.eq;
      var dd = peak - p.eq;
      if (dd > mdd) { mdd = dd; mddPct = peak > 0 ? dd / peak : 0; }
    });
    var streak = 0, kind = 0;
    for (var i = closed.length - 1; i >= 0; i--) {
      var k = closed[i].pnl > 0 ? 1 : closed[i].pnl < 0 ? -1 : 0;
      if (k === 0) break;
      if (kind === 0) kind = k;
      if (k !== kind) break;
      streak++;
    }
    var rs = closed.filter(function (t) { return t.r != null; }).map(function (t) { return t.r; });
    var n = closed.length;
    var stats = {
      n: n, base: base, end: eq, net: eq - base,
      wins: wins.length, losses: losses.length,
      winRate: n ? wins.length / n : null,
      pf: gl > 0 ? gw / gl : (gw > 0 ? Infinity : null),
      avgWin: wins.length ? gw / wins.length : null,
      avgLoss: losses.length ? -gl / losses.length : null,
      expectancy: n ? (eq - base) / n : null,
      avgR: rs.length ? sum(rs, function (x) { return x; }) / rs.length : null,
      mdd: mdd, mddPct: mddPct, streak: streak, kind: kind,
      best: n ? closed.reduce(function (a, b) { return b.pnl > a.pnl ? b : a; }) : null,
      worst: n ? closed.reduce(function (a, b) { return b.pnl < a.pnl ? b : a; }) : null
    };
    var inPeriod = all.filter(function (t) { return t.date >= cutoff; });
    state.derived = { isSample: isSample, all: all, inPeriod: inPeriod, closed: closed, pts: pts, stats: stats };
    return state.derived;
  }

  /* ---------- render ---------- */
  function render() {
    var d = derive();
    renderHeader(d); renderKpis(d); renderBreakdown(d); renderLog(d); renderSettings(); renderStorage();
    drawChart();
  }

  function renderHeader(d) {
    var rows = d.inPeriod.slice().sort(cmpAsc);
    $('#sub').textContent = rows.length
      ? rows.length + ' trade · ' + fmtDate(rows[0].date, true) + ' sampai ' + fmtDate(rows[rows.length - 1].date, true)
      : 'Belum ada trade pada periode ini';
    var b = $('#banner');
    if (d.isSample) {
      b.hidden = false;
      b.innerHTML = state.ready
        ? '<b>Data contoh.</b> Angka di bawah hanya ilustrasi. Tambahkan trade pertama Anda dan data contoh ini langsung hilang.'
        : '<b>Memuat jurnal Anda…</b> Sementara ini yang tampil adalah data contoh.';
    } else b.hidden = true;
    $('#btn-add').disabled = state.mode === 'pending';
    $('#btn-export').disabled = d.isSample || !state.dl;
    $('#btn-export').hidden = !state.dl && state.mode !== 'pending' ? true : false;
  }

  function tone(n) { return n > 0 ? 'gain' : n < 0 ? 'loss' : ''; }

  function renderKpis(d) {
    var s = d.stats, none = '—';
    var baseLabel = state.period === 'all' ? 'modal awal' : 'ekuitas awal periode';
    var cells = [];
    cells.push('<div class="kpi lead"><div class="l">Net P/L</div><div class="v ' + (s.n ? tone(s.net) : '') + '">' + (s.n ? money(s.net, { sign: true }) : none) + '</div><div class="s">' + (s.n && s.base > 0 ? (s.net >= 0 ? '+' : MINUS) + pct(Math.abs(s.net) / s.base, 1) + ' dari ' + baseLabel : 'Belum ada trade tertutup') + '</div></div>');
    cells.push('<div class="kpi"><div class="l">Win rate</div><div class="v">' + (s.n ? pct(s.winRate, 1) : none) + '</div><div class="s">' + (s.n ? s.wins + ' menang · ' + s.losses + ' kalah' : '') + '</div></div>');
    cells.push('<div class="kpi"><div class="l">Profit factor</div><div class="v">' + (s.pf == null ? none : s.pf === Infinity ? '∞' : nf2.format(s.pf)) + '</div><div class="s">' + (s.avgWin != null && s.avgLoss != null ? 'Rata-rata ' + money(s.avgWin, { sign: true }) + ' / ' + money(s.avgLoss) : s.avgWin != null ? 'Rata-rata menang ' + money(s.avgWin, { sign: true }) : '') + '</div></div>');
    cells.push('<div class="kpi"><div class="l">Ekspektasi / trade</div><div class="v ' + (s.n ? tone(s.expectancy) : '') + '">' + (s.n ? money(s.expectancy, { sign: true }) : none) + '</div><div class="s">' + (s.avgR != null ? 'Rata-rata ' + fmtR(s.avgR) : 'Isi stop loss untuk hitung R') + '</div></div>');
    cells.push('<div class="kpi"><div class="l">Max drawdown</div><div class="v ' + (s.mdd > 0 ? 'loss' : '') + '">' + (s.n ? (s.mdd > 0 ? MINUS : '') + pct(s.mddPct, 1) : none) + '</div><div class="s">' + (s.n && s.mdd > 0 ? money(s.mdd) + ' dari puncak' : s.n ? 'Belum pernah turun' : '') + '</div></div>');
    var st = s.streak ? s.streak + (s.kind > 0 ? ' menang' : ' kalah') : none;
    cells.push('<div class="kpi"><div class="l">Rentetan</div><div class="v ' + (s.streak ? (s.kind > 0 ? 'gain' : 'loss') : '') + '">' + st + '</div><div class="s">' + (s.best ? 'Terbaik ' + esc(s.best.symbol) + ' ' + compact(s.best.pnl) + ' · Terburuk ' + esc(s.worst.symbol) + ' ' + compact(s.worst.pnl) : '') + '</div></div>');
    $('#kpis').innerHTML = cells.join('');
  }

  function niceTicks(lo, hi, count) {
    var raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
    var step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    var start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step, out = [];
    for (var v = start; v <= end + step / 2; v += step) out.push(Math.round(v / step) * step);
    return out;
  }

  var chartGeo = null;
  function readoutHtml(i) {
    var d = state.derived, p = d.pts[i];
    if (!p) return '';
    if (i === 0) return '<span><b>' + (state.period === 'all' ? 'Modal awal' : 'Ekuitas awal') + '</b></span><span class="mono">' + money(p.eq) + '</span>';
    var t = p.t;
    return '<span>' + esc(fmtDate(t.date)) + '</span><span><b>' + esc(t.symbol) + '</b></span><span class="mono ' + tone(t.pnl) + '">' + money(t.pnl, { sign: true }) + '</span><span>Ekuitas <span class="mono">' + money(p.eq) + '</span></span>';
  }

  function drawChart() {
    var host = $('#chart'), d = state.derived;
    if (!d) return;
    var pts = d.pts, ro = $('#readout');
    if (pts.length < 2) {
      host.innerHTML = '<p class="empty">Belum ada trade tertutup pada periode ini.</p>';
      ro.innerHTML = ''; chartGeo = null; return;
    }
    var W = Math.max(host.clientWidth, 260), H = 240, m = { l: 58, r: 14, t: 14, b: 28 };
    var eqs = pts.map(function (p) { return p.eq; });
    var lo = Math.min.apply(null, eqs), hi = Math.max.apply(null, eqs);
    if (lo === hi) { lo -= 1; hi += 1; }
    var ticks = niceTicks(lo, hi, 4), y0 = ticks[0], y1 = ticks[ticks.length - 1], n = pts.length;
    var labels = ticks.map(compact);
    if (new Set(labels).size < labels.length) {
      labels = ticks.map(function (v) { return state.settings.currency === 'IDR' ? nf0.format(v) : nf2.format(v); });
      m.l = Math.max.apply(null, labels.map(function (t) { return t.length; })) * 6.7 + 16;
    }
    var X = function (i) { return m.l + (W - m.l - m.r) * (i / (n - 1)); };
    var Y = function (v) { return m.t + (H - m.t - m.b) * (1 - (v - y0) / (y1 - y0)); };
    var r1 = function (v) { return Math.round(v * 10) / 10; };
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Kurva ekuitas">';
    ticks.forEach(function (v, ti) {
      s += '<line class="grid-l" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + r1(Y(v)) + '" y2="' + r1(Y(v)) + '"/>';
      s += '<text class="tk" x="' + (m.l - 8) + '" y="' + r1(Y(v) + 4) + '" text-anchor="end">' + esc(labels[ti]) + '</text>';
    });
    var base = pts[0].eq;
    if (base >= y0 && base <= y1) {
      s += '<line class="base-l" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + r1(Y(base)) + '" y2="' + r1(Y(base)) + '"/>';
    }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + r1(X(i)) + ' ' + r1(Y(p.eq)); }).join(' ');
    s += '<path class="eq-area" d="' + line + ' L' + r1(X(n - 1)) + ' ' + (H - m.b) + ' L' + r1(X(0)) + ' ' + (H - m.b) + ' Z"/>';
    s += '<path class="eq-line" d="' + line + '"/>';
    s += '<text class="tk" x="' + m.l + '" y="' + (H - 8) + '" text-anchor="start">' + (state.period === 'all' ? 'Awal' : fmtDate(pts[1].t.date)) + '</text>';
    if (n >= 5) { var mid = Math.round((n - 1) / 2); s += '<text class="tk" x="' + r1(X(mid)) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(fmtDate(pts[mid].t.date)) + '</text>'; }
    s += '<text class="tk" x="' + (W - m.r) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(fmtDate(pts[n - 1].t.date)) + '</text>';
    s += '<line class="hv-l" id="hv-line" x1="0" x2="0" y1="' + m.t + '" y2="' + (H - m.b) + '" visibility="hidden"/>';
    s += '<circle class="eq-dot" id="hv-dot" r="5" cx="' + r1(X(n - 1)) + '" cy="' + r1(Y(pts[n - 1].eq)) + '"/>';
    s += '<rect id="hv-hit" x="' + m.l + '" y="0" width="' + (W - m.l - m.r) + '" height="' + H + '" fill="transparent"/>';
    s += '</svg>';
    host.innerHTML = s;
    chartGeo = { W: W, m: m, n: n, X: X, Y: Y };
    ro.innerHTML = readoutHtml(n - 1);
    var hit = $('#hv-hit'), dot = $('#hv-dot'), vl = $('#hv-line');
    function at(i) {
      dot.setAttribute('cx', r1(X(i))); dot.setAttribute('cy', r1(Y(pts[i].eq)));
      vl.setAttribute('x1', r1(X(i))); vl.setAttribute('x2', r1(X(i))); vl.setAttribute('visibility', 'visible');
      ro.innerHTML = readoutHtml(i);
    }
    hit.addEventListener('pointermove', function (e) {
      var rect = hit.getBoundingClientRect();
      var f = (e.clientX - rect.left) / rect.width;
      at(Math.max(0, Math.min(n - 1, Math.round(f * (n - 1)))));
    });
    hit.addEventListener('pointerleave', function () { at(n - 1); vl.setAttribute('visibility', 'hidden'); });
  }

  function groupBy(rows, keyFn) {
    var map = {}, order = [];
    rows.forEach(function (t) {
      var k = keyFn(t);
      if (!map[k]) { map[k] = { k: k, n: 0, w: 0, net: 0 }; order.push(k); }
      var g = map[k]; g.n++; if (t.pnl > 0) g.w++; g.net += t.pnl;
    });
    return order.map(function (k) { return map[k]; }).sort(function (a, b) { return b.net - a.net; });
  }

  function renderBreakdown(d) {
    ['setup', 'tag'].forEach(function (k) { $('#tab-' + k).setAttribute('aria-selected', state.tab === k ? 'true' : 'false'); });
    var rows = d.closed, host = $('#brk');
    if (!rows.length) { host.innerHTML = '<p class="empty">Belum ada trade tertutup pada periode ini.</p>'; return; }
    var groups = state.tab === 'setup'
      ? groupBy(rows, function (t) { return t.setup || 'Tanpa strategi'; })
      : groupBy(rows, function (t) { return t.tag || 'Tidak dicatat'; });
    var cap = '';
    if (state.tab === 'tag') {
      var tagged = rows.filter(function (t) { return t.tag; });
      if (tagged.length) {
        var ok = tagged.filter(function (t) { return t.tag === 'Sesuai rencana'; });
        var off = tagged.filter(function (t) { return t.tag !== 'Sesuai rencana'; });
        cap = '<p class="cap">' + ok.length + ' dari ' + tagged.length + ' trade sesuai rencana (' + pct(ok.length / tagged.length, 0) + ').' +
          (off.length ? ' Trade di luar rencana: <b class="' + tone(sum(off, function (t) { return t.pnl; })) + '">' + money(sum(off, function (t) { return t.pnl; }), { sign: true }) + '</b>.' : '') + '</p>';
      } else cap = '<p class="cap">Catat kondisi psikologi di tiap trade untuk melihat pengaruhnya ke hasil.</p>';
    }
    var maxAbs = Math.max.apply(null, groups.map(function (g) { return Math.abs(g.net); })) || 1;
    host.innerHTML = cap + '<ul class="brk">' + groups.map(function (g) {
      return '<li><div class="r1"><span class="nm">' + esc(g.k) + '</span><span class="mono ' + tone(g.net) + '">' + money(g.net, { sign: true }) + '</span></div>' +
        '<div class="mt">' + g.n + ' trade · win rate ' + pct(g.w / g.n, 0) + '</div>' +
        '<div class="bar"><i class="' + (g.net < 0 ? 'neg' : '') + '" style="width:' + Math.max(3, Math.round(Math.abs(g.net) / maxAbs * 100)) + '%"></i></div></li>';
    }).join('') + '</ul>';
  }

  function renderLog(d) {
    var q = state.q.trim().toLowerCase();
    var rows = d.inPeriod.filter(function (t) {
      if (q && (t.symbol || '').toLowerCase().indexOf(q) < 0 && (t.setup || '').toLowerCase().indexOf(q) < 0) return false;
      if (state.result === 'win') return !t.open && t.pnl > 0;
      if (state.result === 'loss') return !t.open && t.pnl < 0;
      if (state.result === 'open') return t.open;
      return true;
    }).sort(function (a, b) { return -cmpAsc(a, b); });
    var host = $('#log');
    if (!rows.length) { host.innerHTML = '<p class="empty">Tidak ada trade yang cocok dengan filter.</p>'; return; }
    var html = '<table><thead><tr><th>Tanggal</th><th>Instrumen</th><th>Posisi</th><th class="r">Masuk → keluar</th><th class="r">Jumlah</th><th class="r">P/L</th><th class="r">R</th><th>Strategi</th><th></th></tr></thead><tbody>';
    rows.forEach(function (t) {
      var a = ASSETS[t.asset] || ASSETS.saham, ex = !!state.expanded[t.id];
      html += '<tr><td><button type="button" class="rowtoggle" data-action="toggle" data-id="' + esc(t.id) + '" aria-expanded="' + ex + '">' + esc(fmtDate(t.date)) + '</button></td>' +
        '<td><b>' + esc(t.symbol) + '</b><span class="sub">' + esc(a.label) + '</span></td>' +
        '<td><span class="pill ' + (t.side === 'short' ? 'short' : 'long') + '">' + (t.side === 'short' ? 'Short' : 'Long') + '</span></td>' +
        '<td class="r num">' + nfPx.format(t.entry) + ' → ' + (t.open ? '—' : nfPx.format(t.exit)) + '</td>' +
        '<td class="r num">' + nfPx.format(t.qty) + ' ' + esc(a.unit.toLowerCase()) + '</td>' +
        '<td class="r num ' + (t.open ? '' : tone(t.pnl)) + '">' + (t.open ? '<span class="pill open">Terbuka</span>' : money(t.pnl, { sign: true })) + '</td>' +
        '<td class="r num">' + fmtR(t.r) + '</td>' +
        '<td>' + esc(t.setup || '—') + (t.tag ? '<span class="sub">' + esc(t.tag) + '</span>' : '') + '</td>' +
        '<td class="act">' + actionCell(t) + '</td></tr>';
      if (ex) {
        html += '<tr class="detail"><td colspan="9"><div class="detail-grid">' +
          '<span>Stop loss <b>' + (t.sl != null ? nfPx.format(t.sl) : '—') + '</b></span>' +
          '<span>Target <b>' + (t.tp != null ? nfPx.format(t.tp) : '—') + '</b></span>' +
          '<span>Biaya <b>' + money(+t.fee || 0) + '</b></span>' +
          '<span>Kontrak <b>' + nfPx.format(t.mult) + '</b></span>' +
          '<span>Risiko <b>' + (t.risk > 0 ? money(t.risk) : '—') + '</b></span></div>' +
          (t.notes ? '<p class="detail-note">' + esc(t.notes) + '</p>' : '<p class="detail-note" style="color:var(--muted)">Tidak ada catatan.</p>') + '</td></tr>';
      }
    });
    host.innerHTML = html + '</tbody></table>';
  }

  function actionCell(t) {
    if (t.sample) return '<span class="sub" style="display:inline">contoh</span>';
    if (state.confirmDel === t.id) {
      return '<button type="button" class="del" data-action="del-yes" data-id="' + esc(t.id) + '">Ya, hapus</button><button type="button" data-action="del-no">Batal</button>';
    }
    return '<button type="button" data-action="edit" data-id="' + esc(t.id) + '">Ubah</button><button type="button" class="del" data-action="del" data-id="' + esc(t.id) + '">Hapus</button>';
  }

  function renderSettings() {
    var si = $('#set-start'), sc = $('#set-cur');
    if (document.activeElement !== si) si.value = state.settings.start;
    sc.value = state.settings.currency;
    $('#period').value = state.period;
  }

  function renderStorage() {
    var t = state.mode === 'db'
      ? 'Jurnal tersimpan di akun Anda dan hanya Anda yang bisa melihatnya.'
      : state.mode === 'local'
        ? 'Jurnal tersimpan di browser ini saja. Ekspor CSV secara berkala sebagai cadangan.'
        : '';
    $('#storage').textContent = t + (t ? ' ' : '') + 'P/L dihitung dari selisih harga × jumlah × kelipatan kontrak, dikurangi biaya. R = P/L dibagi risiko (jarak ke stop loss).';
  }

  /* ---------- penyimpanan ---------- */
  function persistLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ trades: state.trades, settings: state.settings })); } catch (e) {}
  }
  function useLocal() {
    if (!state.dl) {
      state.dl = { save: function (r) {
        var b = new Blob([r.data], { type: 'text/csv;charset=utf-8' }), u = URL.createObjectURL(b), a = document.createElement('a');
        a.href = u; a.download = r.filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
        return Promise.resolve({ status: 'saved' });
      } };
    }
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var v = JSON.parse(raw);
        if (Array.isArray(v.trades)) state.trades = v.trades;
        if (v.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS, v.settings);
      }
    } catch (e) {}
    state.mode = 'local'; state.ready = true; render();
  }
  async function initStore() {
    if (!window.claude || typeof window.claude.use !== 'function') { useLocal(); return; }
    var db = null, uid = null;
    try {
      var got = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
      db = got[0]; state.dl = got[2];
      uid = got[1] ? await got[1].id() : null;
    } catch (e) {}
    if (!(db && uid)) { useLocal(); return; }
    var col = db.collection('data/users/' + uid);
    state.col = col; state.mode = 'db';
    col.onSnapshot(function (snap) {
      var trades = [], st = null;
      snap.docs.forEach(function (doc) {
        var v = doc.data();
        if (!v) return;
        if (doc.id === 'settings') st = v;
        else if (v.symbol) trades.push(Object.assign({}, v, { id: doc.id }));
      });
      state.trades = trades;
      if (st) state.settings = Object.assign({}, DEFAULT_SETTINGS, st);
      state.ready = true; render();
    }, function () {
      toast('Koneksi ke penyimpanan terputus. Muat ulang halaman.', true);
    });
  }
  function errMsg(e) {
    var c = e && e.code;
    if (c === 'invalid_argument') return 'Akun Anda tidak punya izin menyimpan data di halaman ini.';
    if (c === 'quota_exceeded') return 'Penyimpanan penuh. Hapus beberapa trade lama atau ekspor CSV dulu.';
    return 'Gagal menyimpan. Coba lagi.';
  }
  async function saveTrade(t) {
    if (state.mode === 'db') {
      try { await state.col.doc(t.id).set(t); return true; } catch (e) { toast(errMsg(e), true); return false; }
    }
    var i = state.trades.findIndex(function (x) { return x.id === t.id; });
    if (i >= 0) state.trades[i] = t; else state.trades.push(t);
    persistLocal(); render(); return true;
  }
  async function removeTrade(id) {
    if (state.mode === 'db') {
      try { await state.col.doc(id).delete(); toast('Trade dihapus'); } catch (e) { toast(errMsg(e), true); }
      return;
    }
    state.trades = state.trades.filter(function (x) { return x.id !== id; });
    persistLocal(); render(); toast('Trade dihapus');
  }
  async function saveSettings() {
    if (state.mode === 'db') {
      try { await state.col.doc('settings').set(state.settings); } catch (e) { toast(errMsg(e), true); }
    } else persistLocal();
    render();
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg, bad) {
    var el = $('#toast');
    el.textContent = msg; el.className = 'toast' + (bad ? ' bad' : ''); el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 3200);
  }

  /* ---------- form ---------- */
  function fillSetups() {
    var base = ['Breakout', 'Pullback MA20', 'Reversal', 'Support/Resistance'];
    var seen = {}, list = [];
    state.trades.map(function (t) { return t.setup; }).concat(base).forEach(function (s) { if (s && !seen[s]) { seen[s] = 1; list.push(s); } });
    $('#setups').innerHTML = list.map(function (s) { return '<option value="' + esc(s) + '"></option>'; }).join('');
  }
  function syncAsset() {
    var a = ASSETS[$('#f-asset').value] || ASSETS.saham;
    $('#lbl-qty').textContent = 'Jumlah (' + a.unit.toLowerCase() + ')';
    $('#hint-qty').textContent = a.hint;
    $('#f-mult').placeholder = nf0.format(a.mult);
  }
  function readForm() {
    var g = function (id) { return $('#' + id).value; };
    return {
      id: state.editingId || newId(), createdAt: state.editingCreated || Date.now(),
      date: g('f-date'), symbol: g('f-symbol').trim().toUpperCase(), asset: g('f-asset'),
      side: $('input[name="side"]:checked').value,
      entry: num(g('f-entry')), exit: num(g('f-exit')), qty: num(g('f-qty')),
      sl: num(g('f-sl')), tp: num(g('f-tp')), fee: num(g('f-fee')) || 0, mult: num(g('f-mult')),
      setup: g('f-setup').trim(), tag: g('f-tag'), notes: g('f-notes').trim()
    };
  }
  function updatePreview() {
    var t = readForm(), p = $('#f-preview');
    if (!(t.entry > 0 && t.qty > 0)) { p.textContent = 'Isi harga masuk dan jumlah untuk melihat estimasi.'; return; }
    var c = calc(t), parts = [];
    parts.push(c.open ? 'Posisi terbuka' : 'P/L ' + money(c.pnl, { sign: true }));
    if (c.risk > 0) parts.push('Risiko ' + money(c.risk));
    if (c.r != null) parts.push(fmtR(c.r));
    p.textContent = parts.join(' · ');
  }
  function openDrawer(t) {
    state.editingId = t ? t.id : null; state.editingCreated = t ? t.createdAt : null; state.autoAsset = !t;
    $('#d-title').textContent = t ? 'Ubah trade' : 'Tambah trade';
    var set = function (id, v) { $('#' + id).value = v == null ? '' : v; };
    set('f-date', t ? t.date : todayStr()); set('f-symbol', t ? t.symbol : ''); set('f-asset', t ? t.asset : 'saham');
    $(t && t.side === 'short' ? '#side-short' : '#side-long').checked = true;
    set('f-entry', t && t.entry); set('f-exit', t && t.exit); set('f-qty', t && t.qty);
    set('f-fee', t && t.fee ? t.fee : ''); set('f-mult', t && t.mult); set('f-sl', t && t.sl); set('f-tp', t && t.tp);
    set('f-setup', t && t.setup); set('f-tag', t ? t.tag : ''); set('f-notes', t && t.notes);
    $('#f-error').hidden = true;
    fillSetups(); syncAsset(); updatePreview();
    $('#drawer').hidden = false;
    setTimeout(function () { $('#f-symbol').focus(); }, 30);
  }
  function closeDrawer() { $('#drawer').hidden = true; }

  /* ---------- ekspor ---------- */
  function csvCell(v) {
    if (v == null) return '';
    var s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  async function exportCsv() {
    if (!state.dl || !state.trades.length) return;
    var head = ['tanggal', 'instrumen', 'aset', 'posisi', 'harga_masuk', 'harga_keluar', 'jumlah', 'ukuran_kontrak', 'stop_loss', 'target', 'biaya', 'pl', 'r', 'strategi', 'psikologi', 'catatan'];
    var rows = state.trades.map(function (t) { return Object.assign({}, t, calc(t)); }).sort(cmpAsc).map(function (t) {
      return [t.date, t.symbol, t.asset, t.side, t.entry, t.exit, t.qty, t.mult, t.sl, t.tp, t.fee || 0,
        t.pnl == null ? '' : Math.round(t.pnl * 100) / 100, t.r == null ? '' : Math.round(t.r * 100) / 100, t.setup, t.tag, t.notes].map(csvCell).join(',');
    });
    var data = '\ufeff' + head.join(',') + '\n' + rows.join('\n') + '\n';
    try {
      await state.dl.save({ filename: 'jurnal-trading-' + todayStr() + '.csv', data: data });
      toast('CSV disimpan');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast('Ekspor tidak tersedia di tampilan ini.', true);
    }
  }

  /* ---------- event ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action],[data-tab]');
    if (!el) return;
    if (el.dataset.tab) { state.tab = el.dataset.tab; renderBreakdown(state.derived); return; }
    var a = el.dataset.action, id = el.dataset.id;
    var find = function () { return state.trades.find(function (t) { return t.id === id; }); };
    if (a === 'close') closeDrawer();
    else if (a === 'toggle') { state.expanded[id] = !state.expanded[id]; renderLog(state.derived); }
    else if (a === 'edit') { var t = find(); if (t) openDrawer(t); }
    else if (a === 'del') { state.confirmDel = id; renderLog(state.derived); }
    else if (a === 'del-no') { state.confirmDel = null; renderLog(state.derived); }
    else if (a === 'del-yes') { state.confirmDel = null; removeTrade(id); }
  });
  $('#btn-add').addEventListener('click', function () { openDrawer(null); });
  $('#btn-export').addEventListener('click', exportCsv);
  $('#period').addEventListener('change', function (e) { state.period = e.target.value; render(); });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; renderLog(state.derived); });
  $('#result').addEventListener('change', function (e) { state.result = e.target.value; renderLog(state.derived); });
  $('#set-start').addEventListener('change', function (e) {
    var v = num(e.target.value);
    if (v == null || v < 0) { e.target.value = state.settings.start; return; }
    state.settings = Object.assign({}, state.settings, { start: v }); saveSettings();
  });
  $('#set-cur').addEventListener('change', function (e) {
    state.settings = Object.assign({}, state.settings, { currency: e.target.value }); saveSettings();
  });
  $('#f-asset').addEventListener('change', function () { state.autoAsset = false; syncAsset(); updatePreview(); });
  $('#f-symbol').addEventListener('input', function (e) {
    if (!state.autoAsset) return;
    var sy = e.target.value.trim().toUpperCase(), sel = $('#f-asset'), v = null;
    if (/^XAU/.test(sy)) v = 'emas';
    else if (/^XAG/.test(sy)) v = 'perak';
    else if (/^(BTC|ETH|SOL|XRP|BNB)/.test(sy)) v = 'kripto';
    else if (/^[A-Z]{6}$/.test(sy)) v = 'forex';
    if (v && sel.value !== v) { sel.value = v; syncAsset(); updatePreview(); }
  });
  $('#trade-form').addEventListener('input', updatePreview);
  $('#trade-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var t = readForm(), err = $('#f-error'), msg = '';
    if (!t.date) msg = 'Isi tanggal trade.';
    else if (!t.symbol) msg = 'Isi nama instrumen.';
    else if (!(t.entry > 0)) msg = 'Harga masuk harus lebih dari 0.';
    else if (!(t.qty > 0)) msg = 'Jumlah harus lebih dari 0.';
    else if (t.exit != null && t.exit < 0) msg = 'Harga keluar tidak boleh negatif.';
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    err.hidden = true;
    var wasEdit = !!state.editingId;
    if (await saveTrade(t)) { closeDrawer(); toast(wasEdit ? 'Perubahan disimpan' : 'Trade disimpan'); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer(); });

  if ('ResizeObserver' in window) {
    var lastW = 0;
    new ResizeObserver(function () {
      var w = $('#chart').clientWidth;
      if (w !== lastW) { lastW = w; drawChart(); }
    }).observe($('#chart'));
  }

  render();
  initStore();
})();
</script>

</body>
</html>
